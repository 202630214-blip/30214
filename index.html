<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지? - 오늘 저녁 메뉴 추천</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans KR', 'sans-serif'],
                        title: ['Gowun Dodum', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #f97316;
            border-radius: 10px;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-amber-50/50 text-gray-800 min-h-screen flex flex-col font-sans selection:bg-orange-200">

    <!-- Header -->
    <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-orange-100 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="resetFilters()">
                <div class="w-10 h-10 bg-orange-500 rounded-2xl flex items-center justify-center text-white text-xl shadow-md shadow-orange-200">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold font-title text-gray-900 leading-none">오늘 뭐 먹지?</h1>
                    <p class="text-xs text-orange-600 font-medium mt-0.5">맛있는 저녁 메뉴 추천</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="openFavoritesModal()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-orange-200 text-orange-700 bg-orange-50 hover:bg-orange-100 text-sm font-medium transition-colors">
                    <i class="fa-solid fa-heart text-red-500"></i>
                    <span>찜목록</span>
                    <span id="favCount" class="bg-orange-500 text-white text-xs px-1.5 py-0.2 rounded-full font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-4 py-6 flex-1 w-full flex flex-col gap-6">

        <!-- Hero / Random Picker Banner -->
        <section class="bg-gradient-to-r from-orange-500 via-amber-500 to-orange-600 rounded-3xl p-6 md:p-8 text-white shadow-xl shadow-orange-500/10 relative overflow-hidden">
            <div class="absolute -right-8 -bottom-8 opacity-15 text-white pointer-events-none">
                <i class="fa-solid fa-burger text-9xl"></i>
            </div>
            
            <div class="relative z-10 max-w-xl">
                <span class="inline-block bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-xs font-semibold mb-3 tracking-wide">
                    🎲 매일 밤 고민되는 메뉴 선택!
                </span>
                <h2 class="text-2xl md:text-3xl font-extrabold font-title mb-2 leading-tight">
                    오늘 저녁 메뉴,<br class="sm:hidden"> 결정장애는 이제 그만!
                </h2>
                <p class="text-orange-100 text-sm md:text-base mb-6">
                    무엇을 먹어야 할지 모르겠다면 무작위 추첨 버튼을 눌러보세요.
                </p>

                <button onclick="pickRandomMenu()" class="w-full sm:w-auto bg-white text-orange-600 hover:bg-orange-50 font-bold px-8 py-3.5 rounded-2xl shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2 text-lg active:scale-95">
                    <i class="fa-solid fa-dice text-xl animate-spin-slow"></i>
                    <span>오늘의 저녁 메뉴 랜덤 뽑기</span>
                </button>
            </div>
        </section>

        <!-- Filters Section -->
        <section class="bg-white rounded-2xl p-4 md:p-5 shadow-sm border border-orange-100 flex flex-col gap-4">
            
            <!-- Category Tabs -->
            <div class="flex items-center gap-2 overflow-x-auto custom-scrollbar pb-1">
                <button onclick="setCategory('all')" class="cat-btn active flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all bg-orange-500 text-white shadow-sm">
                    <span>✨ 전체</span>
                </button>
                <button onclick="setCategory('한식')" class="cat-btn flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all bg-gray-100 text-gray-600 hover:bg-gray-200">
                    <span>🍚 한식</span>
                </button>
                <button onclick="setCategory('중식')" class="cat-btn flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all bg-gray-100 text-gray-600 hover:bg-gray-200">
                    <span>🥢 중식</span>
                </button>
                <button onclick="setCategory('일식')" class="cat-btn flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all bg-gray-100 text-gray-600 hover:bg-gray-200">
                    <span>🍣 일식</span>
                </button>
                <button onclick="setCategory('양식')" class="cat-btn flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all bg-gray-100 text-gray-600 hover:bg-gray-200">
                    <span>🍝 양식</span>
                </button>
                <button onclick="setCategory('분식/기타')" class="cat-btn flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all bg-gray-100 text-gray-600 hover:bg-gray-200">
                    <span>🍕 기타/분식</span>
                </button>
            </div>

            <hr class="border-gray-100">

            <!-- Mood / Situation Tags & Search -->
            <div class="flex flex-col md:flex-row gap-3 justify-between items-start md:items-center">
                <!-- Mood Chips -->
                <div class="flex flex-wrap gap-1.5 items-center">
                    <span class="text-xs font-semibold text-gray-400 mr-1"><i class="fa-solid fa-tags"></i> 태그:</span>
                    <button onclick="toggleTag('매운맛')" class="tag-btn text-xs px-2.5 py-1 rounded-lg border border-gray-200 text-gray-600 hover:border-orange-300">🌶️ 매운맛</button>
                    <button onclick="toggleTag('국물')" class="tag-btn text-xs px-2.5 py-1 rounded-lg border border-gray-200 text-gray-600 hover:border-orange-300">🍲 국물요리</button>
                    <button onclick="toggleTag('가벼운')" class="tag-btn text-xs px-2.5 py-1 rounded-lg border border-gray-200 text-gray-600 hover:border-orange-300">🥗 가벼운/다이어트</button>
                    <button onclick="toggleTag('혼밥')" class="tag-btn text-xs px-2.5 py-1 rounded-lg border border-gray-200 text-gray-600 hover:border-orange-300">👤 혼밥/간단</button>
                    <button onclick="toggleTag('고기')" class="tag-btn text-xs px-2.5 py-1 rounded-lg border border-gray-200 text-gray-600 hover:border-orange-300">🥩 고기파티</button>
                    <button onclick="toggleTag('술안주')" class="tag-btn text-xs px-2.5 py-1 rounded-lg border border-gray-200 text-gray-600 hover:border-orange-300">🍺 술 한잔</button>
                </div>

                <!-- Search Box -->
                <div class="relative w-full md:w-56">
                    <input type="text" id="searchInput" oninput="renderMenuList()" placeholder="메뉴 검색..." class="w-full pl-9 pr-4 py-1.5 text-sm rounded-xl border border-gray-200 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-all">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-xs"></i>
                </div>
            </div>
        </section>

        <!-- Menu List Grid Header -->
        <div class="flex justify-between items-center px-1">
            <p class="text-sm font-semibold text-gray-600">
                총 <span id="menuCount" class="text-orange-600 font-bold">0</span>개의 메뉴
            </p>
            <button onclick="resetFilters()" class="text-xs text-gray-400 hover:text-orange-600 underline underline-offset-2">
                필터 초기화
            </button>
        </div>

        <!-- Menu Grid -->
        <div id="menuGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Dynamic JavaScript Content Cards Rendered Here -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-orange-100 mt-12 py-6 text-center text-xs text-gray-400">
        <div class="max-w-5xl mx-auto px-4">
            <p class="mb-1 font-medium">😋 오늘 저녁 맛있는 한 끼 되세요!</p>
            <p>© 2026 Today's Dinner Recommendation. All rights reserved.</p>
        </div>
    </footer>

    <!-- Random Pick Modal -->
    <div id="randomModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 md:p-8 max-w-sm w-full text-center shadow-2xl relative transform transition-all scale-95 opacity-0" id="randomModalCard">
            
            <button onclick="closeRandomModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 w-8 h-8 rounded-full flex items-center justify-center bg-gray-100">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="py-4">
                <span class="text-xs font-bold text-orange-500 tracking-wider uppercase bg-orange-50 px-3 py-1 rounded-full">Today's Pick</span>
                <h3 class="text-lg font-bold text-gray-800 mt-2 mb-4">오늘 저녁 메뉴는 바로!</h3>
                
                <!-- Display Box -->
                <div class="bg-amber-50 border-2 border-dashed border-orange-300 rounded-2xl p-6 my-2 min-h-[160px] flex flex-col items-center justify-center relative overflow-hidden">
                    <div id="rouletteIcon" class="text-5xl mb-2 transition-transform">🍲</div>
                    <div id="rouletteText" class="text-2xl font-black font-title text-gray-900">추첨 중...</div>
                    <div id="rouletteCategory" class="text-xs text-orange-600 font-semibold mt-1"></div>
                </div>

                <div id="resultDetails" class="mt-4 text-xs text-gray-500 hidden">
                    <p id="resultDesc" class="mb-3 font-medium text-gray-600"></p>
                    <div class="flex gap-2 justify-center">
                        <a id="searchNaverBtn" target="_blank" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-3 rounded-xl flex items-center justify-center gap-1 transition-colors">
                            <i class="fa-solid fa-map-location-dot"></i> 지도 검색
                        </a>
                        <a id="searchRecipeBtn" target="_blank" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-3 rounded-xl flex items-center justify-center gap-1 transition-colors">
                            <i class="fa-solid fa-book-open"></i> 레시피 보기
                        </a>
                    </div>
                </div>

                <button id="rePickBtn" onclick="pickRandomMenu()" class="mt-4 text-xs font-semibold text-gray-400 hover:text-orange-600 underline">
                    🔄 다시 뽑기
                </button>
            </div>
        </div>
    </div>

    <!-- Favorites Modal -->
    <div id="favModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl relative max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-heart text-red-500"></i> 내가 찜한 저녁 메뉴
                </h3>
                <button onclick="closeFavModal()" class="text-gray-400 hover:text-gray-600 w-8 h-8 rounded-full flex items-center justify-center bg-gray-100">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div id="favList" class="flex-1 overflow-y-auto custom-scrollbar flex flex-col gap-2 my-2">
                <!-- Favorites items rendered here -->
            </div>
        </div>
    </div>

    <!-- JavaScript Data and Logic -->
    <script>
        // 저녁 메뉴 데이터 베이스
        const menuData = [
            { id: 1, name: "김치찌개", category: "한식", tags: ["국물", "매운맛", "혼밥"], icon: "🥘", desc: "얼큰하고 칼칼한 한국인의 영혼을 달래주는 기본 대표 메뉴" },
            { id: 2, name: "삼겹살 구이", category: "한식", tags: ["고기", "술안주"], icon: "🥓", desc: "퇴근 후 고소하게 구워먹는 노릇노릇 삼겹살과 소주 한 잔" },
            { id: 3, name: "짜장면 & 탕수육", category: "중식", tags: ["혼밥"], icon: "🍜", desc: "달콤짭조름한 짜장면과 바삭한 탕수육의 환상적인 조합" },
            { id: 4, name: "초밥 (스시)", category: "일식", tags: ["가벼운", "혼밥"], icon: "🍣", desc: "신선한 회와 깔끔한 샤리의 정갈하고 고급스러운 한 끼" },
            { id: 5, name: "크림 파스타", category: "양식", tags: ["가벼운"], icon: "🍝", desc: "부드럽고 고소한 크림소스가 입안 가득 감도는 파스타" },
            { id: 6, name: "떡볶이 & 튀김", category: "분식/기타", tags: ["매운맛", "혼밥"], icon: "🍢", desc: "매콤달콤한 양념에 튀김과 순대를 찍어 먹는 완벽 조합" },
            { id: 7, name: "마라탕", category: "중식", tags: ["매운맛", "국물", "혼밥"], icon: "🍲", desc: "얼얼하고 중독성 강한 특유의 향신료 풍미 가득한 마라탕" },
            { id: 8, name: "소고기 수제버거", category: "분식/기타", tags: ["혼밥"], icon: "🍔", desc: "육즙이 육성 터지는 패티와 고소한 치즈의 버거 세트" },
            { id: 9, name: "치킨 (양념/후라이드)", category: "분식/기타", tags: ["고기", "술안주"], icon: "🍗", desc: "하루의 피로를 날려버리는 바삭한 치킨과 시원한 맥주" },
            { id: 10, name: "돈카츠 (돈가스)", category: "일식", tags: ["혼밥"], icon: "🍱", desc: "겉은 바삭하고 속은 촉촉한 두툼한 일식 돼지고기 튀김" },
            { id: 11, name: "부대찌개", category: "한식", tags: ["국물", "매운맛", "술안주"], icon: "🍲", desc: "햄, 소시지, 라면사리가 듬뿍 들어간 얼큰 보글보글 찌개" },
            { id: 12, name: "연어 샐러드 볼", category: "양식", tags: ["가벼운", "혼밥"], icon: "🥗", desc: "신선한 연어와 채소, 곡물이 어우러진 가볍고 건강한 식사" },
            { id: 13, name: "곱창 구이/전골", category: "한식", tags: ["고기", "국물", "술안주"], icon: "🥘", desc: "쫄깃하고 고소한 쫄깃 곱창과 얼큰한 전골 국물" },
            { id: 14, name: "라멘 (돈코츠)", category: "일식", tags: ["국물", "혼밥"], icon: "🍜", desc: "진하고 깊은 돼지사골 육수와 생면의 부드러운 만남" },
            { id: 15, name: "화덕 피자", category: "양식", tags: ["술안주"], icon: "🍕", desc: "쫀득한 도우와 쫄깃한 치즈가 피어나는 갓 구운 피자" },
            { id: 16, name: "닭갈비", category: "한식", tags: ["매운맛", "고기"], icon: "🥘", desc: "매콤한 양념 닭고기와 야채, 그리고 볶음밥 마무리!" },
            { id: 17, name: "양꼬치 & 꿔바로우", category: "중식", tags: ["고기", "술안주"], icon: "🍢", desc: "칭따오 맥주와 함께 즐기는 노릇한 양꼬치와 꿔바로우" },
            { id: 18, name: "샤브샤브", category: "한식", tags: ["국물", "가벼운"], icon: "🍲", desc: "담백한 육수에 야채와 소고기를 데쳐먹는 깔끔한 저녁" }
        ];

        let selectedCategory = 'all';
        let selectedTags = [];
        let favorites = JSON.parse(localStorage.getItem('dinner_favorites')) || [];

        // DOM Elements
        const menuGrid = document.getElementById('menuGrid');
        const menuCount = document.getElementById('menuCount');
        const searchInput = document.getElementById('searchInput');
        const favCount = document.getElementById('favCount');

        // Init App
        window.addEventListener('DOMContentLoaded', () => {
            renderMenuList();
            updateFavCount();
        });

        // Set Category
        function setCategory(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if ((cat === 'all' && btn.innerText.includes('전체')) || btn.innerText.includes(cat)) {
                    btn.className = "cat-btn active flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all bg-orange-500 text-white shadow-sm";
                } else {
                    btn.className = "cat-btn flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all bg-gray-100 text-gray-600 hover:bg-gray-200";
                }
            });
            renderMenuList();
        }

        // Toggle Tag
        function toggleTag(tag) {
            if (selectedTags.includes(tag)) {
                selectedTags = selectedTags.filter(t => t !== tag);
            } else {
                selectedTags.push(tag);
            }

            document.querySelectorAll('.tag-btn').forEach(btn => {
                const tagName = btn.innerText.replace(/[^가-힣]/g, '');
                if (selectedTags.includes(tagName)) {
                    btn.className = "tag-btn text-xs px-2.5 py-1 rounded-lg border border-orange-500 bg-orange-50 font-bold text-orange-600";
                } else {
                    btn.className = "tag-btn text-xs px-2.5 py-1 rounded-lg border border-gray-200 text-gray-600 hover:border-orange-300";
                }
            });
            renderMenuList();
        }

        // Filter Logic
        function getFilteredMenu() {
            const keyword = searchInput.value.trim().toLowerCase();
            return menuData.filter(item => {
                const matchCategory = selectedCategory === 'all' || item.category === selectedCategory;
                const matchTags = selectedTags.length === 0 || selectedTags.every(tag => item.tags.includes(tag));
                const matchSearch = item.name.toLowerCase().includes(keyword) || item.desc.toLowerCase().includes(keyword);
                return matchCategory && matchTags && matchSearch;
            });
        }

        // Render Menu Cards
        function renderMenuList() {
            const filtered = getFilteredMenu();
            menuCount.innerText = filtered.length;

            if (filtered.length === 0) {
                menuGrid.innerHTML = `
                    <div class="col-span-full py-12 text-center text-gray-400">
                        <i class="fa-solid fa-utensils-slash text-4xl mb-3 text-gray-300"></i>
                        <p class="font-medium text-sm">조건에 맞는 저녁 메뉴가 없습니다.</p>
                        <button onclick="resetFilters()" class="mt-2 text-xs text-orange-600 font-bold underline">필터 초기화하기</button>
                    </div>
                `;
                return;
            }

            menuGrid.innerHTML = filtered.map(item => {
                const isFav = favorites.includes(item.id);
                return `
                    <div class="bg-white rounded-2xl p-5 border border-gray-100 shadow-sm hover:shadow-md transition-all flex flex-col justify-between group">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-3xl p-2 bg-amber-50 rounded-2xl group-hover:scale-110 transition-transform">${item.icon}</span>
                                <button onclick="toggleFavorite(${item.id})" class="text-xl transition-colors ${isFav ? 'text-red-500' : 'text-gray-300 hover:text-red-400'}">
                                    <i class="fa-solid fa-heart"></i>
                                </button>
                            </div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-orange-100 text-orange-700">${item.category}</span>
                            </div>
                            <h3 class="text-lg font-bold text-gray-800 mb-1 font-title">${item.name}</h3>
                            <p class="text-xs text-gray-500 leading-relaxed mb-4">${item.desc}</p>
                        </div>

                        <div>
                            <div class="flex flex-wrap gap-1 mb-3">
                                ${item.tags.map(t => `<span class="text-[11px] text-gray-400">#${t}</span>`).join(' ')}
                            </div>
                            <div class="flex gap-2 border-t border-gray-50 pt-3">
                                <a href="https://map.naver.com/v5/search/${encodeURIComponent(item.name + ' 맛집')}" target="_blank" class="flex-1 text-center py-1.5 rounded-lg bg-gray-50 hover:bg-green-50 hover:text-green-600 text-xs text-gray-600 font-semibold transition-colors">
                                    <i class="fa-solid fa-location-dot"></i> 맛집 찾기
                                </a>
                                <a href="https://search.naver.com/search.naver?query=${encodeURIComponent(item.name + ' 레시피')}" target="_blank" class="flex-1 text-center py-1.5 rounded-lg bg-gray-50 hover:bg-orange-50 hover:text-orange-600 text-xs text-gray-600 font-semibold transition-colors">
                                    <i class="fa-solid fa-book"></i> 레시피
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Reset Filters
        function resetFilters() {
            selectedCategory = 'all';
            selectedTags = [];
            searchInput.value = '';
            
            document.querySelectorAll('.cat-btn').forEach((btn, idx) => {
                if (idx === 0) {
                    btn.className = "cat-btn active flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all bg-orange-500 text-white shadow-sm";
                } else {
                    btn.className = "cat-btn flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-semibold whitespace-nowrap transition-all bg-gray-100 text-gray-600 hover:bg-gray-200";
                }
            });

            document.querySelectorAll('.tag-btn').forEach(btn => {
                btn.className = "tag-btn text-xs px-2.5 py-1 rounded-lg border border-gray-200 text-gray-600 hover:border-orange-300";
            });

            renderMenuList();
        }

        // Toggle Favorites
        function toggleFavorite(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('dinner_favorites', JSON.stringify(favorites));
            updateFavCount();
            renderMenuList();
            if(!document.getElementById('favModal').classList.contains('hidden')) {
                renderFavList();
            }
        }

        function updateFavCount() {
            favCount.innerText = favorites.length;
        }

        // Favorites Modal Toggle
        function openFavoritesModal() {
            renderFavList();
            document.getElementById('favModal').classList.remove('hidden');
        }
        function closeFavModal() {
            document.getElementById('favModal').classList.add('hidden');
        }

        function renderFavList() {
            const favContainer = document.getElementById('favList');
            const favItems = menuData.filter(item => favorites.includes(item.id));

            if (favItems.length === 0) {
                favContainer.innerHTML = `
                    <div class="py-8 text-center text-gray-400 text-sm">
                        <i class="fa-regular fa-heart text-3xl mb-2"></i>
                        <p>아직 찜한 메뉴가 없습니다.</p>
                    </div>
                `;
                return;
            }

            favContainer.innerHTML = favItems.map(item => `
                <div class="flex items-center justify-between p-3 bg-amber-50/60 rounded-xl border border-orange-100">
                    <div class="flex items-center gap-3">
                        <span class="text-2xl">${item.icon}</span>
                        <div>
                            <h4 class="font-bold text-sm text-gray-800">${item.name}</h4>
                            <span class="text-[10px] text-orange-600 font-semibold">${item.category}</span>
                        </div>
                    </div>
                    <button onclick="toggleFavorite(${item.id})" class="text-red-500 hover:text-gray-400 text-sm px-2">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            `).join('');
        }

        // Random Roulette Logic
        function pickRandomMenu() {
            const currentList = getFilteredMenu();
            const pool = currentList.length > 0 ? currentList : menuData;

            const modal = document.getElementById('randomModal');
            const modalCard = document.getElementById('randomModalCard');
            const iconEl = document.getElementById('rouletteIcon');
            const textEl = document.getElementById('rouletteText');
            const catEl = document.getElementById('rouletteCategory');
            const detailsEl = document.getElementById('resultDetails');
            const rePickBtn = document.getElementById('rePickBtn');

            // Open Modal Animation
            modal.classList.remove('hidden');
            setTimeout(() => {
                modalCard.classList.remove('scale-95', 'opacity-0');
                modalCard.classList.add('scale-100', 'opacity-100');
            }, 10);

            detailsEl.classList.add('hidden');
            rePickBtn.classList.add('hidden');

            let counter = 0;
            const totalDuration = 1800; // 1.8s
            const intervalTime = 80;

            const interval = setInterval(() => {
                const randomTemp = pool[Math.floor(Math.random() * pool.length)];
                iconEl.innerText = randomTemp.icon;
                textEl.innerText = randomTemp.name;
                catEl.innerText = randomTemp.category;
                iconEl.style.transform = `scale(${1 + (counter % 3) * 0.1})`;

                counter += intervalTime;
                if (counter >= totalDuration) {
                    clearInterval(interval);
                    
                    // Final Choice
                    const finalPick = pool[Math.floor(Math.random() * pool.length)];
                    iconEl.innerText = finalPick.icon;
                    textEl.innerText = finalPick.name;
                    catEl.innerText = `[${finalPick.category}]`;
                    iconEl.style.transform = "scale(1.2)";

                    document.getElementById('resultDesc').innerText = finalPick.desc;
                    document.getElementById('searchNaverBtn').href = `https://map.naver.com/v5/search/${encodeURIComponent(finalPick.name + ' 맛집')}`;
                    document.getElementById('searchRecipeBtn').href = `https://search.naver.com/search.naver?query=${encodeURIComponent(finalPick.name + ' 레시피')}`;

                    detailsEl.classList.remove('hidden');
                    rePickBtn.classList.remove('hidden');

                    // Confetti Effect
                    confetti({
                        particleCount: 70,
                        spread: 60,
                        origin: { y: 0.6 }
                    });
                }
            }, intervalTime);
        }

        function closeRandomModal() {
            const modal = document.getElementById('randomModal');
            const modalCard = document.getElementById('randomModalCard');
            modalCard.classList.remove('scale-100', 'opacity-100');
            modalCard.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }
    </script>
</body>
</html>
