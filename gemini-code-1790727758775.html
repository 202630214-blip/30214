<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 학습 - AI 맞춤형 스터디 플래너</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        /* 화이트 테마 화사한 배경 */
        body {
            background: linear-gradient(135deg, #F1F5F9 0%, #E2E8F0 100%);
            color: #1E293B;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 깔끔한 화이트 메인 카드 */
        .wizard-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 680px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 36px;
            border: 1px solid #E2E8F0;
            position: relative;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 26px;
            color: #0F172A;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            font-size: 14px;
            color: #64748B;
            margin-top: 6px;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: #E2E8F0;
            border-radius: 4px;
            margin-bottom: 28px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 20%;
            background: linear-gradient(90deg, #0EA5E9, #2563EB);
            transition: width 0.3s ease;
        }

        .step-container {
            display: none;
        }

        .step-container.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .step-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #0F172A;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .step-title span {
            background: #E0F2FE;
            color: #0284C7;
            border: 1px solid #BAE6FD;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 13px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            color: #334155;
        }

        /* 밝은 폼 입력 요소 스타일 */
        input[type="date"],
        input[type="time"],
        input[type="number"],
        input[type="text"],
        select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #CBD5E1;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
            background-color: #F8FAFC;
            color: #0F172A;
        }

        input[type="date"] {
            cursor: pointer;
            color-scheme: light;
        }

        input:focus, select:focus {
            border-color: #0EA5E9;
            background-color: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }

        select option {
            background-color: #FFFFFF;
            color: #0F172A;
        }

        .dday-badge {
            margin-top: 12px;
            padding: 12px;
            background-color: #FEF2F2;
            border: 1px solid #FCA5A5;
            color: #EF4444;
            font-weight: 700;
            border-radius: 10px;
            text-align: center;
            font-size: 16px;
            display: none;
        }

        .time-row, .subject-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            align-items: center;
            background: #F8FAFC;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #E2E8F0;
        }

        .time-row input[type="time"] { flex: 1; }
        .subject-row input[type="text"] { flex: 2; }
        .subject-row select { flex: 1.5; }
        .subject-row input[type="number"] { flex: 1.2; }

        .btn-del {
            background-color: #FEF2F2;
            color: #EF4444;
            border: 1px solid #FCA5A5;
            border-radius: 8px;
            padding: 10px 12px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .btn-del:hover {
            background-color: #EF4444;
            color: #FFF;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            margin-top: 28px;
            gap: 12px;
        }

        button.btn-next, button.btn-prev, button.btn-add {
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        button.btn-next {
            background: linear-gradient(135deg, #0EA5E9, #2563EB);
            color: white;
            flex: 1;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.25);
        }

        button.btn-next:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        button.btn-prev {
            background-color: #F1F5F9;
            color: #475569;
            border: 1px solid #CBD5E1;
        }

        button.btn-prev:hover {
            background-color: #E2E8F0;
            color: #0F172A;
        }

        button.btn-add {
            background-color: #F0F9FF;
            color: #0284C7;
            border: 1.5px dashed #38BDF8;
            width: 100%;
            margin-top: 8px;
        }

        button.btn-add:hover {
            background-color: #E0F2FE;
            border-color: #0284C7;
        }

        /* 컨디션 카드리스트 */
        .condition-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .condition-card {
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 16px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: #F8FAFC;
        }

        .condition-card:hover { border-color: #38BDF8; }
        .condition-card.selected {
            border: 2px solid #0EA5E9;
            background-color: #F0F9FF;
        }

        .condition-card .emoji { font-size: 28px; display: block; margin-bottom: 6px; }
        .condition-card .title { font-weight: 700; font-size: 14px; color: #0F172A; }
        .condition-card .desc { font-size: 11px; color: #64748B; margin-top: 2px; }

        /* 화이트 플래너 프레임 */
        .planner-paper {
            background: #FFFFFF;
            border: 1px solid #CBD5E1;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }

        .planner-header {
            display: grid;
            grid-template-columns: 1fr 1fr 1.5fr;
            border: 1px solid #CBD5E1;
            border-radius: 12px;
            margin-bottom: 16px;
            overflow: hidden;
            background: #F8FAFC;
        }

        .planner-box {
            padding: 12px 16px;
            border-right: 1px solid #E2E8F0;
        }

        .planner-box:last-child { border-right: none; }
        .planner-box-title { font-size: 11px; font-weight: 800; color: #64748B; letter-spacing: 0.5px; }
        .planner-box-val { font-size: 18px; font-weight: 800; color: #0F172A; margin-top: 2px; }

        .planner-body {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 16px;
        }

        .planner-list-section, .planner-grid-section {
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 16px;
            background: #F8FAFC;
            display: flex;
            flex-direction: column;
            min-height: 240px;
        }

        .planner-section-title {
            font-size: 12px;
            font-weight: 800;
            color: #64748B;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid #E2E8F0;
            letter-spacing: 0.5px;
        }

        .subject-item-display {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 15px;
            font-weight: 700;
        }

        .subject-num {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #FFFFFF;
            font-weight: 800;
        }

        .grid-table {
            width: 100%;
            border-collapse: collapse;
        }

        .grid-table th {
            font-size: 11px;
            color: #64748B;
            padding: 4px;
            border-bottom: 1px solid #E2E8F0;
            text-align: center;
            font-weight: 700;
        }

        .grid-table td {
            height: 24px;
            border: 1px solid #E2E8F0;
            padding: 1px;
            vertical-align: middle;
            text-align: center;
        }

        .grid-table td.hour-label {
            border: none;
            font-weight: 800;
            width: 28px;
            color: #475569;
            font-size: 11px;
        }

        .highlight-cell {
            width: 100%;
            height: 100%;
            border-radius: 3px;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-print {
            background: linear-gradient(135deg, #10B981, #059669);
            color: white;
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }

        .btn-print:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            body {
                background: white !important;
                color: black !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .header, 
            .progress-bar-container, 
            .step-title, 
            .btn-group, 
            .action-btns,
            .step-container:not(#step5) {
                display: none !important;
            }

            .wizard-card {
                box-shadow: none !important;
                padding: 0 !important;
                max-width: 100% !important;
                border: none !important;
                background: white !important;
            }

            .planner-paper {
                background: white !important;
                border: 1px solid #000 !important;
            }

            .planner-box-val, .hour-label {
                color: #000 !important;
            }
        }
    </style>
</head>
<body>

<div class="wizard-card">
    <div class="header">
        <h1>오늘의 학습 ☀️✨</h1>
        <p>시험 D-Day 및 컨디션 맞춤형 시간표</p>
    </div>

    <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- STEP 1 -->
    <div class="step-container active" id="step1">
        <div class="step-title"><span>1단계</span> 시험 D-Day 설정</div>
        <label for="examDate">시험이 몇 월 몇 일인가요?</label>
        <input type="date" id="examDate" onchange="calculateDday()" onclick="openDatePicker(this)">
        <div class="dday-badge" id="ddayBadge"></div>
        
        <div class="btn-group">
            <div></div>
            <button type="button" class="btn-next" onclick="validateAndNextStep1()">다음 단계로 👉</button>
        </div>
    </div>

    <!-- STEP 2 -->
    <div class="step-container" id="step2">
        <div class="step-title"><span>2단계</span> 공부 가능 시간 설정</div>
        <label>오늘 공부할 수 있는 시간대를 선택해 주세요 (예: 09:00 ~ 15:00)</label>
        
        <div id="timeContainer">
            <div class="time-row">
                <input type="time" class="start-time" value="09:00" onchange="updateTotalStudyTime()">
                <span>~</span>
                <input type="time" class="end-time" value="15:00" onchange="updateTotalStudyTime()">
            </div>
        </div>
        
        <button type="button" class="btn-add" onclick="addTimeSlot()">+ 시간대 추가하기</button>
        
        <div style="margin-top: 14px; font-size: 14px; font-weight: 700; color: #0284C7;" id="totalTimeDisplay">
            총 공부 가능 시간: 6시간 0분
        </div>

        <div class="btn-group">
            <button type="button" class="btn-prev" onclick="prevStep(2)">👈 이전</button>
            <button type="button" class="btn-next" onclick="nextStep(2)">다음 단계로 👉</button>
        </div>
    </div>

    <!-- STEP 3 -->
    <div class="step-container" id="step3">
        <div class="step-title"><span>3단계</span> 오늘의 컨디션 입력</div>
        <label>오늘의 몸과 마음 상태는 어떤가요?</label>
        
        <div class="condition-options">
            <div class="condition-card" onclick="selectCondition(this, 1.0)">
                <span class="emoji">🔥</span>
                <div class="title">최상</div>
                <div class="desc">100% 소화 가능</div>
            </div>
            <div class="condition-card selected" onclick="selectCondition(this, 0.8)">
                <span class="emoji">😊</span>
                <div class="title">보통</div>
                <div class="desc">80% 집중 추천</div>
            </div>
            <div class="condition-card" onclick="selectCondition(this, 0.6)">
                <span class="emoji">😴</span>
                <div class="title">피곤함</div>
                <div class="desc">60% 여유롭게</div>
            </div>
        </div>
        <input type="hidden" id="conditionValue" value="0.8">

        <div class="btn-group">
            <button type="button" class="btn-prev" onclick="prevStep(3)">👈 이전</button>
            <button type="button" class="btn-next" onclick="nextStep(3)">다음 단계로 👉</button>
        </div>
    </div>

    <!-- STEP 4 -->
    <div class="step-container" id="step4">
        <div class="step-title"><span>4단계</span> 과목 및 우선순위 설정</div>
        <label>공부할 과목, 우선순위, 목표 시간을 입력하세요</label>
        
        <div id="subjectContainer">
            <div class="subject-row">
                <input type="text" class="sub-name" placeholder="과목명 (예: 수학)" value="수학">
                <select class="sub-priority">
                    <option value="1" selected>우선순위 1위</option>
                    <option value="2">우선순위 2위</option>
                    <option value="3">우선순위 3위</option>
                    <option value="4">우선순위 4위</option>
                    <option value="5">우선순위 5위</option>
                </select>
                <input type="number" class="sub-time" placeholder="시간(분)" value="120" step="10" min="10">
                <button type="button" class="btn-del" onclick="deleteSubject(this)">✕</button>
            </div>
            <div class="subject-row">
                <input type="text" class="sub-name" placeholder="과목명 (예: 국어)" value="국어">
                <select class="sub-priority">
                    <option value="1">우선순위 1위</option>
                    <option value="2" selected>우선순위 2위</option>
                    <option value="3">우선순위 3위</option>
                    <option value="4">우선순위 4위</option>
                    <option value="5">우선순위 5위</option>
                </select>
                <input type="number" class="sub-time" placeholder="시간(분)" value="120" step="10" min="10">
                <button type="button" class="btn-del" onclick="deleteSubject(this)">✕</button>
            </div>
        </div>

        <button type="button" class="btn-add" id="btnAddSubject">+ 과목 추가하기</button>

        <div class="btn-group">
            <button type="button" class="btn-prev" onclick="prevStep(4)">👈 이전</button>
            <button type="button" class="btn-next" onclick="generatePlanner()">✨ AI 스터디 플래너 생성</button>
        </div>
    </div>

    <!-- STEP 5 -->
    <div class="step-container" id="step5">
        <div class="step-title"><span>5단계</span> 완성된 스터디 플래너</div>
        
        <div class="planner-paper" id="plannerPaper">
            <div class="planner-header">
                <div class="planner-box">
                    <div class="planner-box-title">DATE</div>
                    <div class="planner-box-val" id="planDate">-</div>
                </div>
                <div class="planner-box">
                    <div class="planner-box-title">D-DAY</div>
                    <div class="planner-box-val" id="planDday" style="color: #EF4444;">D-DAY</div>
                </div>
                <div class="planner-box">
                    <div class="planner-box-title">GOAL</div>
                    <div class="planner-box-val" id="planGoal">0분</div>
                </div>
            </div>

            <div class="planner-body">
                <div class="planner-list-section">
                    <div class="planner-section-title">LIST</div>
                    <div id="plannerListContainer"></div>
                </div>

                <div class="planner-grid-section">
                    <div class="planner-section-title">TIME TABLE (매시간 50분~00분 휴식)</div>
                    <table class="grid-table">
                        <thead>
                            <tr>
                                <th></th>
                                <th>10</th>
                                <th>20</th>
                                <th>30</th>
                                <th>40</th>
                                <th>50</th>
                                <th>00</th>
                            </tr>
                        </thead>
                        <tbody id="gridTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="action-btns">
            <button type="button" class="btn-print" onclick="window.print()">🖨️ 플래너 인쇄 / PDF 저장</button>
        </div>

        <div class="btn-group">
            <button type="button" class="btn-prev" onclick="prevStep(5)">👈 다시 수정하기</button>
        </div>
    </div>

</div>

<script>
    /* 하얀 배경에 잘 보이는 선명한 선율 파스텔 과목 색상 */
    const SUBJECT_COLORS = [
        { bg: '#FF6B81', text: '#E11D48' }, // 핑크
        { bg: '#38BDF8', text: '#0284C7' }, // 스카이블루
        { bg: '#34D399', text: '#059669' }, // 에메랄드
        { bg: '#FBBF24', text: '#D97706' }, // 옐로우/앰버
        { bg: '#A78BFA', text: '#7C3AED' }, // 퍼플
        { bg: '#FB923C', text: '#EA580C' }  // 오렌지
    ];

    let currentStep = 1;

    document.addEventListener('DOMContentLoaded', () => {
        const examInput = document.getElementById('examDate');
        if (examInput) {
            const todayStr = new Date().toISOString().split('T')[0];
            examInput.setAttribute('min', todayStr);
        }

        const addBtn = document.getElementById('btnAddSubject');
        if (addBtn) addBtn.addEventListener('click', addSubject);
        updateTotalStudyTime();
    });

    function openDatePicker(inputElem) {
        if ('showPicker' in HTMLInputElement.prototype) {
            try {
                inputElem.showPicker();
            } catch (e) {}
        }
    }

    function showStep(step) {
        document.querySelectorAll('.step-container').forEach(el => el.classList.remove('active'));
        document.getElementById(`step${step}`).classList.add('active');
        
        const progressBar = document.getElementById('progressBar');
        progressBar.style.width = `${(step / 5) * 100}%`;
        currentStep = step;
    }

    function validateAndNextStep1() {
        const examDate = document.getElementById('examDate').value;
        if (!examDate) {
            alert('시험 날짜를 먼저 선택해 주세요!');
            const inputElem = document.getElementById('examDate');
            inputElem.focus();
            openDatePicker(inputElem);
            return;
        }
        nextStep(1);
    }

    function nextStep(step) {
        showStep(step + 1);
    }

    function prevStep(step) {
        showStep(step - 1);
    }

    function calculateDday() {
        const input = document.getElementById('examDate').value;
        const badge = document.getElementById('ddayBadge');
        if (!input) {
            badge.style.display = 'none';
            return;
        }

        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const target = new Date(input);

        const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
        badge.style.display = 'block';

        if (diff > 0) badge.innerText = `시험까지 D-${diff}일 남았습니다! 🎯`;
        else if (diff === 0) badge.innerText = `오늘이 시험 당일입니다! 🎉`;
        else badge.innerText = `지나간 날짜입니다. 다시 선택해 주세요.`;
    }

    function addTimeSlot() {
        const container = document.getElementById('timeContainer');
        const div = document.createElement('div');
        div.className = 'time-row';
        div.innerHTML = `
            <input type="time" class="start-time" value="13:00" onchange="updateTotalStudyTime()">
            <span>~</span>
            <input type="time" class="end-time" value="15:00" onchange="updateTotalStudyTime()">
            <button type="button" class="btn-del" onclick="this.parentElement.remove(); updateTotalStudyTime();">✕</button>
        `;
        container.appendChild(div);
        updateTotalStudyTime();
    }

    function updateTotalStudyTime() {
        const starts = document.querySelectorAll('.start-time');
        const ends = document.querySelectorAll('.end-time');
        let totalMinutes = 0;

        for (let i = 0; i < starts.length; i++) {
            if (starts[i].value && ends[i].value) {
                const [sH, sM] = starts[i].value.split(':').map(Number);
                const [eH, eM] = ends[i].value.split(':').map(Number);
                let diff = (eH * 60 + eM) - (sH * 60 + sM);
                if (diff > 0) totalMinutes += diff;
            }
        }

        const hrs = Math.floor(totalMinutes / 60);
        const mins = totalMinutes % 60;
        document.getElementById('totalTimeDisplay').innerText = `총 공부 가능 시간: ${hrs}시간 ${mins}분`;
    }

    function selectCondition(card, val) {
        document.querySelectorAll('.condition-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        document.getElementById('conditionValue').value = val;
    }

    function addSubject() {
        const container = document.getElementById('subjectContainer');
        const div = document.createElement('div');
        div.className = 'subject-row';
        div.innerHTML = `
            <input type="text" class="sub-name" placeholder="과목명">
            <select class="sub-priority">
                <option value="1">우선순위 1위</option>
                <option value="2">우선순위 2위</option>
                <option value="3" selected>우선순위 3위</option>
                <option value="4">우선순위 4위</option>
                <option value="5">우선순위 5위</option>
            </select>
            <input type="number" class="sub-time" placeholder="시간(분)" value="30" step="10" min="10">
            <button type="button" class="btn-del" onclick="deleteSubject(this)">✕</button>
        `;
        container.appendChild(div);
    }

    function deleteSubject(btn) {
        const container = document.getElementById('subjectContainer');
        if (container.children.length > 1) {
            btn.parentElement.remove();
        } else {
            alert('최소 1개 이상의 과목이 필요합니다.');
        }
    }

    function generatePlanner() {
        try {
            const examInput = document.getElementById('examDate').value;
            const condition = parseFloat(document.getElementById('conditionValue').value);

            const now = new Date();
            document.getElementById('planDate').innerText = `${now.getMonth() + 1}/${now.getDate()}`;

            if (examInput) {
                const today = new Date(); today.setHours(0,0,0,0);
                const target = new Date(examInput);
                const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
                document.getElementById('planDday').innerText = diff >= 0 ? `D-${diff}` : 'D-DAY';
            }

            const startTimes = document.querySelectorAll('.start-time');
            const endTimes = document.querySelectorAll('.end-time');
            let availableSlots = [];

            let minHour = 24, maxHour = 0;

            for (let i = 0; i < startTimes.length; i++) {
                if (startTimes[i].value && endTimes[i].value) {
                    const [sH, sM] = startTimes[i].value.split(':').map(Number);
                    const [eH, eM] = endTimes[i].value.split(':').map(Number);
                    
                    let startMins = sH * 60 + sM;
                    let endMins = eH * 60 + eM;

                    if (endMins > startMins) {
                        minHour = Math.min(minHour, sH);
                        maxHour = Math.max(maxHour, Math.ceil(endMins / 60));

                        for (let m = startMins; m < endMins; m += 10) {
                            if ((m % 60) !== 50) {
                                availableSlots.push(m);
                            }
                        }
                    }
                }
            }

            if (availableSlots.length === 0) {
                alert('2단계에서 공부 가능 시간을 먼저 설정해 주세요!');
                showStep(2);
                return;
            }

            const names = document.querySelectorAll('.sub-name');
            const priorities = document.querySelectorAll('.sub-priority');
            const times = document.querySelectorAll('.sub-time');

            let subjects = [];
            for (let i = 0; i < names.length; i++) {
                const name = names[i].value.trim();
                const prio = parseInt(priorities[i].value);
                const time = parseInt(times[i].value);

                if (name && time > 0) {
                    subjects.push({
                        name,
                        priority: prio,
                        time: Math.round(time * condition),
                        color: SUBJECT_COLORS[subjects.length % SUBJECT_COLORS.length]
                    });
                }
            }

            if (subjects.length === 0) {
                alert('과목 정보를 1개 이상 입력해 주세요!');
                return;
            }

            subjects.sort((a, b) => a.priority - b.priority);

            const listContainer = document.getElementById('plannerListContainer');
            listContainer.innerHTML = '';
            let totalPlanMins = 0;

            subjects.forEach((sub, idx) => {
                totalPlanMins += sub.time;
                const item = document.createElement('div');
                item.className = 'subject-item-display';
                item.innerHTML = `
                    <span class="subject-num" style="background-color: ${sub.color.bg};">${idx + 1}</span>
                    <span style="color: ${sub.color.text};">${sub.name}</span>
                    <span style="font-size: 13px; color: #64748B; font-weight: 600; margin-left: auto;">${sub.time}분</span>
                `;
                listContainer.appendChild(item);
            });

            const goalHours = Math.floor(totalPlanMins / 60);
            const goalMinutes = totalPlanMins % 60;

            let goalText = '';
            if (goalHours > 0) goalText += `${goalHours}시간 `;
            if (goalMinutes > 0) goalText += `${goalMinutes}분`;
            if (goalHours === 0 && goalMinutes === 0) goalText = '0분';

            document.getElementById('planGoal').innerText = goalText.trim();

            const gridBody = document.getElementById('gridTableBody');
            gridBody.innerHTML = '';

            if (minHour >= maxHour) { minHour = 9; maxHour = 15; }

            let slotColorMap = {};
            let slotIndex = 0;

            subjects.forEach(sub => {
                let neededBlocks = Math.ceil(sub.time / 10);
                while (neededBlocks > 0 && slotIndex < availableSlots.length) {
                    let minuteSlot = availableSlots[slotIndex];
                    slotColorMap[minuteSlot] = sub.color;
                    slotIndex++;
                    neededBlocks--;
                }
            });

            for (let h = minHour; h < maxHour; h++) {
                const tr = document.createElement('tr');
                
                const tdLabel = document.createElement('td');
                tdLabel.className = 'hour-label';
                tdLabel.innerText = String(h).padStart(2, '0');
                tr.appendChild(tdLabel);

                for (let m = 0; m < 60; m += 10) {
                    const td = document.createElement('td');
                    const slotKey = h * 60 + m;

                    if (slotColorMap[slotKey]) {
                        const block = document.createElement('div');
                        block.className = 'highlight-cell';
                        block.style.backgroundColor = slotColorMap[slotKey].bg;
                        td.appendChild(block);
                    }
                    tr.appendChild(td);
                }
                gridBody.appendChild(tr);
            }

            showStep(5);
        } catch (err) {
            console.error(err);
            alert('시간표 생성 중 오류가 발생했습니다. 다시 시도해 주세요.');
        }
    }
</script>
